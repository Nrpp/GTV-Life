name: Release APK

# Dos formas de publicar una versión:
#  - Crear un lanzamiento en GitHub (Releases › Draft a new release) con etiqueta v1.2.3:
#    este workflow compila el APK y lo adjunta.
#  - Lanzar este workflow a mano (Actions › Release APK › Run workflow) indicando la versión:
#    compila el APK y crea él mismo el lanzamiento.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a publicar (p. ej. 1.0.1)"
        required: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar la versión
        id: version
        env:
          TAG: ${{ github.event.release.tag_name || format('v{0}', inputs.version) }}
        run: |
          TAG="v${TAG#v}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::La versión '$TAG' no tiene el formato v1.2.3"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}

      - name: Preparar la firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto ANDROID_KEYSTORE_BASE64. Mira el README (sección 'Firma de los APK')."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK firmado
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon -PappVersion=${{ steps.version.outputs.version }}

      - name: Publicar el APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          APK="GTV-Life-$TAG.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          if [ "${{ github.event_name }}" = "release" ]; then
            gh release upload "$TAG" "$APK" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title "$TAG" --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
